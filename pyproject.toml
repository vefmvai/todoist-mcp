[project]
name = "coach-todoist-mcp"
version = "0.2.0"
description = "Свой MCP-сервер к Todoist для агента-коуча: подзадачи, комментарии и весь практичный набор поверх unified API v1."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vefmv" }]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "tzdata",
]

[project.scripts]
coach-todoist-mcp = "coach_todoist_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_todoist_mcp"]
