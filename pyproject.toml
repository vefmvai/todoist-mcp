[project]
name = "todoist-mcp"
version = "0.3.0"
description = "MCP-сервер к Todoist: задачи, подзадачи, комментарии, структура, фильтры и статистика поверх unified API v1. Ядро отделено от адаптеров — им пользуется и отдельный процесс, и встроенный агент."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vefmv" }]
dependencies = [
    "httpx>=0.27",
    # Верхняя граница обязательна: в mcp 2.0 исчез mcp.server.fastmcp, на котором
    # держится server.py. Без границы свежая установка ставит 2.0 и сервер падает
    # с ModuleNotFoundError — проверено 2026-07-31 при сборке нового окружения.
    # Переход на API 2.0 — отдельная работа, не правка на бегу.
    "mcp>=1.2,<2",
    # Тумблеры кнопок и файл-справка для человека — YAML: его правят руками,
    # и комментарии в нём часть смысла. Верхняя граница по правилу проекта.
    "pyyaml>=6,<7",
    "tzdata",
]

[project.scripts]
todoist-mcp = "todoist_mcp.server:main"
todoist-mcp-tools = "todoist_mcp.table:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todoist_mcp"]
